---
- name: Fail if removed nginx_ppa variable is set
  fail:
    msg: "`nginx_ppa` has been replaced by `nginx_repo_uri`, `nginx_repo_suite` and `nginx_repo_signing_key`. Update your group_vars."
  when: nginx_ppa is defined

- name: Remove legacy Nginx repository
  file:
    path: "/etc/apt/sources.list.d/nginx_org_packages_mainline_{{ ansible_facts['distribution'] | lower }}.list"
    state: absent

- name: Add Nginx repository
  deb822_repository:
    name: nginx
    types: deb
    uris: "{{ nginx_repo_uri }}"
    suites: "{{ nginx_repo_suite }}"
    components: nginx
    signed_by: "{{ nginx_repo_signing_key }}"
  register: result
  until: result is success
  retries: 3
  delay: 5

- name: Install Nginx
  ansible.builtin.apt:
    name: "{{ nginx_package }}"
    state: "{{ nginx_package_state | default(apt_package_state) }}"
    update_cache: true

- name: Ensure site directories exist
  file:
    path: "{{ nginx_path }}/{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - sites-available
    - sites-enabled

- name: Create SSL directory
  file:
    mode: '0700'
    path: "{{ nginx_path }}/ssl"
    state: directory

- name: Copy h5bp configs
  copy:
    src: templates/h5bp
    dest: "{{ nginx_path }}"
    mode: '0755'
  notify: reload nginx

- name: Create nginx.conf
  template:
    src: "{{ nginx_conf }}"
    dest: "{{ nginx_path }}/nginx.conf"
    mode: '0644'
  notify: reload nginx
  tags: nginx-includes

- name: Disable default server
  file:
    path: "{{ nginx_path }}/sites-enabled/default"
    state: absent
  notify: reload nginx

- name: Enable Nginx to start on boot
  service:
    name: nginx
    enabled: yes
    state: started
