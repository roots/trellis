---
- import_tasks: database.yml
  tags: wordpress-setup-database
- import_tasks: self-signed-certificate.yml
  tags: wordpress-setup-self-signed-certificate
- import_tasks: nginx-client-cert.yml
  tags: wordpress-setup-nginx-client-cert

- name: Create web root
  file:
    path: "{{ www_root }}"
    owner: "{{ web_user }}"
    group: "{{ web_group }}"
    mode: '0755'
    state: directory

- name: Create logs folder of sites
  file:
    path: "{{ www_root }}/{{ item.key }}/logs"
    owner: "{{ web_user }}"
    group: "{{ web_group }}"
    mode: '0755'
    state: directory
  loop: "{{ wordpress_sites | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

- name: Ensure configured WordPress runtime group exists
  getent:
    database: group
    key: "{{ wordpress_runtime_group }}"
  when: wordpress_runtime_hardened

- name: Ensure configured WordPress runtime user exists
  getent:
    database: passwd
    key: "{{ wordpress_runtime_user }}"
  register: wordpress_runtime_user_entry
  when: wordpress_runtime_hardened

- name: Look up web group
  getent:
    database: group
    key: "{{ web_group }}"
  register: wordpress_web_group_entry
  when: wordpress_runtime_hardened

- name: Ensure WordPress runtime user can access web group files
  # Deploys run as web_user without root, so `.env` and per-release writable paths
  # are made readable/writable by web_group instead of being chowned to the runtime user.
  vars:
    web_group_entry: "{{ wordpress_web_group_entry.ansible_facts.getent_group[web_group] }}"
    runtime_user_entry: "{{ wordpress_runtime_user_entry.ansible_facts.getent_passwd[wordpress_runtime_user] }}"
  fail:
    msg: |
      WordPress runtime hardening requires `wordpress_runtime_user` ({{ wordpress_runtime_user }}) to be able to read files owned by `web_group` ({{ web_group }}).
      Either add {{ wordpress_runtime_user }} to the {{ web_group }} group, or set `wordpress_runtime_group: {{ web_group }}`.
  when:
    - wordpress_runtime_hardened
    - wordpress_runtime_group != web_group
    - runtime_user_entry[2] != web_group_entry[1]
    - wordpress_runtime_user not in (web_group_entry[2] | default('', true)).split(',')

- name: Ensure hardened writable paths exist and are owned by runtime user
  include_tasks: runtime-writable-paths.yml
  loop: "{{ wordpress_sites | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  when: wordpress_runtime_hardened

- name: Create WordPress php-fpm configuration file
  template:
    src: php-fpm-pool-wordpress.conf.j2
    dest: /etc/php/{{ php_version }}/fpm/pool.d/wordpress.conf
    mode: '0644'
  notify: reload php-fpm

- name: Disable default PHP-FPM pool
  command: mv /etc/php/{{ php_version }}/fpm/pool.d/www.conf /etc/php/{{ php_version }}/fpm/pool.d/www.disabled
  args:
    creates: /etc/php/{{ php_version }}/fpm/pool.d/www.disabled
  when: disable_default_pool | default(true)
  notify: reload php-fpm

- import_tasks: nginx-includes.yml
  tags: [nginx-includes, wordpress-setup-nginx]

- import_tasks: nginx.yml
  tags: wordpress-setup-nginx

- name: Setup WP system cron
  cron:
    name: "{{ item.key }} WordPress cron"
    minute: "{{ item.value.cron_interval | default('*/15') }}"
    user: "{{ (wordpress_runtime_hardened and wordpress_runtime_cron_as_runtime_user) | ternary(wordpress_runtime_user, web_user) }}"
    job: "cd {{ www_root }}/{{ item.key }}/{{ item.value.current_path | default('current') }} && wp cron event run --due-now > /dev/null 2>&1"
    cron_file: "wordpress-{{ item.key | replace('.', '_') }}"
    state: "{{ (cron_enabled and not item.value.multisite.enabled) | ternary('present', 'absent') }}"
  loop: "{{ wordpress_sites | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

- name: Setup WP Multisite system cron
  cron:
    name: "{{ item.key }} WordPress network cron"
    minute: "{{ item.value.cron_interval_multisite | default('*/30') }}"
    user: "{{ (wordpress_runtime_hardened and wordpress_runtime_cron_as_runtime_user) | ternary(wordpress_runtime_user, web_user) }}"
    job: "cd {{ www_root }}/{{ item.key }}/{{ item.value.current_path | default('current') }} && (wp site list --field=url | xargs -n1 -I \\% wp --url=\\% cron event run --due-now) > /dev/null 2>&1"
    cron_file: "wordpress-multisite-{{ item.key | replace('.', '_') }}"
    state: "{{ (cron_enabled and item.value.multisite.enabled) | ternary('present', 'absent') }}"
  loop: "{{ wordpress_sites | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
