---
- name: Ensure hardened shared writable paths exist and are owned by runtime user
  # Keep ownership non-recursive so existing shared contents are not mass-chowned.
  # Only shared paths are handled here. Per-release paths (current/...) have no
  # release to point at on a fresh server and are made group-writable on every
  # deploy instead.
  file:
    path: "{{ www_root }}/{{ item.key }}/{{ path }}"
    owner: "{{ wordpress_runtime_user }}"
    group: "{{ wordpress_runtime_group }}"
    mode: '0775'
    state: directory
  loop: "{{ item.value.runtime_writable_paths | default(wordpress_runtime_writable_paths) | select('match', '^shared/.+') | list }}"
  loop_control:
    loop_var: path
    label: "{{ item.key }} -> {{ path }}"
