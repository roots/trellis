---
- name: Ensure hardened writable paths exist and are owned by runtime user
  # Keep ownership non-recursive so existing shared contents are not mass-chowned.
  # Per-release paths (current/...) are skipped: on a fresh server this would create
  # `current` as a real directory and break the first deploy. The deploy role makes
  # them group-writable in every new release instead.
  file:
    path: "{{ www_root }}/{{ item.key }}/{{ path }}"
    owner: "{{ wordpress_runtime_user }}"
    group: "{{ wordpress_runtime_group }}"
    mode: '0775'
    state: directory
  loop: "{{ item.value.runtime_writable_paths | default(wordpress_runtime_writable_paths) | reject('match', '^' ~ (item.value.current_path | default('current') | regex_escape) ~ '/') | list }}"
  loop_control:
    loop_var: path
    label: "{{ item.key }} -> {{ path }}"
